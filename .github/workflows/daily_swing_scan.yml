name: Daily NSE Swing Scan

on:
  schedule:
    # Run once after market close (≈ 16:00 IST = 10:30 UTC)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run F&O scanner (Technical + OI + PCR) and send Telegram
        run: |
          python main.py --universe fno --workers 6 --top 15
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: swing-results
          path: results/
          retention-days: 14
